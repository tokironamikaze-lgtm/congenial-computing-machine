<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vaquinha Solidária</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #1b5e20, #0f2027);
      color: #fff;
      min-height: 100vh;
    }

    header {
      padding: 30px 15px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      opacity: 0.9;
      margin-top: 8px;
    }

    .container {
      max-width: 420px;
      margin: auto;
      padding: 15px;
    }

    .card {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    }

    .card h2 {
      margin-top: 0;
      font-size: 22px;
      text-align: center;
    }

    .progress {
      background: rgba(255,255,255,0.2);
      border-radius: 30px;
      overflow: hidden;
      height: 18px;
      margin: 15px 0;
    }

    .progress-bar {
      background: linear-gradient(90deg, #00e676, #2e7d32);
      width: 40%;
      height: 100%;
      animation: carregar 1.5s ease;
    }

    @keyframes carregar {
      from { width: 0; }
      to { width: 40%; }
    }

    .valor {
      text-align: center;
      margin-bottom: 20px;
      font-size: 16px;
    }

    .pix-box {
      background: rgba(0,0,0,0.35);
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.15);
    }

    .pix-box h3 {
      margin-top: 0;
      color: #00e676;
    }

    .pix-box input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-size: 15px;
      text-align: center;
      margin: 10px 0;
    }

    .pix-box small {
      opacity: 0.85;
      font-size: 13px;
    }

    footer {
      text-align: center;
      font-size: 13px;
      opacity: 0.7;
      padding: 20px 0;
    }
  </style>
</head>

<body>

  <header>
    <h1>Vaquinha Solidária</h1>
    <p>Ajude essa causa com qualquer valor ❤️</p>
  </header>

  <div class="container">
    <div class="card">
      <h2>🎯 Objetivo: R$ 5.000</h2>

      <div class="progress">
        <div class="progress-bar"></div>
      </div>

      <p class="valor"><strong>Arrecadado:</strong> R$ 2.000</p>

      <div class="pix-box">
        <h3>💚 Doação via PIX</h3>

        <p>Copie a chave abaixo:</p>

        <input
          type="text"
          value="tokironamikaze@gmail.com"
          readonly
          onclick="this.select()"
        >

        <small>
          Nome: santinho<br>
          Banco: Nubank
        </small>
      </div>
    </div>
  </div>

  <footer>
    © 2026 • Vaquinha Online
  </footer>

</body>
</html>
